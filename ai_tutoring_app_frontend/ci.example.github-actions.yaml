name: Flutter CI (Example)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: ai-tutoring-platform-5516-5525/ai_tutoring_app_frontend
        run: flutter pub get
      - name: Analyze
        working-directory: ai-tutoring-platform-5516-5525/ai_tutoring_app_frontend
        run: flutter analyze
      - name: Test
        working-directory: ai-tutoring-platform-5516-5525/ai_tutoring_app_frontend
        run: flutter test
